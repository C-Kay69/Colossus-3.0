<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedPay Instant — Patient Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="/styles.css" rel="stylesheet"></head>
<body>
<div id="authOverlay" class="fixed inset-0 z-50 bg-stone-900/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto"></div>
<header class="bg-cream/95 border-b border-stone-300 px-4 sm:px-6 py-3 sticky top-0 z-30 backdrop-blur">
  <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
    <div><div class="flex items-center gap-2"><span class="text-lg font-bold">MedPay <span class="text-brand">Instant</span></span><span class="tag bg-brand text-white">Patient Portal</span></div><p class="text-xs text-stone-500">Pay the gap later. Leave the hospital now.</p></div>
    <div class="bg-stone-200/70 p-1 rounded-xl flex flex-wrap text-xs font-semibold border border-stone-300">
      <button id="tb1" onclick="setTab('verify')" class="px-3 py-1.5 rounded-lg cursor-pointer">Step 1: KYC &amp; Credit Verification</button>
      <button id="tb2" onclick="setTab('finance')" class="px-3 py-1.5 rounded-lg cursor-pointer">Step 2: Gap Financing &amp; Bill</button>
      <button id="tb3" onclick="setTab('checkout')" class="px-3 py-1.5 rounded-lg cursor-pointer">Step 3: OTP &amp; Gate Pass</button></div>
    <div class="flex items-center gap-2.5"><span class="hidden md:inline text-xs font-semibold text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full">SLA &lt; 1 hr • <span id="liveTimer">--:--</span></span><button class="btn-ghost" onclick="signOut()">Sign out</button></div>
  </div>
</header>
<main class="max-w-6xl mx-auto px-4 sm:px-6 mt-5 space-y-6">
  <section id="banner" class="card border-l-4 border-l-brand"></section>
  <div id="gate" class="hidden"></div>
  <section id="page" class="space-y-6"></section>
  <section id="tracker" class="card"></section>
</main>
<script src="/shared.js"></script><script src="/common.js"></script><script src="/patient/patient.js"></script>
</body></html>
